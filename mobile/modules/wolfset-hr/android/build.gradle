plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.wolfset.hr'
version = '0.1.0'

android {
  namespace "app.wolfset.hr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The Wearable Data Layer: WearableListenerService + MessageEvent.
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
  // ServiceCompat.startForeground with a type, NotificationCompat.CATEGORY_WORKOUT.
  implementation 'androidx.core:core-ktx:1.13.1'
  // The React host and its headless tasks (WorkoutService boots and holds the session's
  // JavaScript). Version resolved by the React Native Gradle plugin, as every Expo module.
  implementation 'com.facebook.react:react-android'
}
