name: CI

on:
  # Every PR, whatever its base — stacked PRs (feature → feature) must get checks too.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: mobile — typecheck, lint, format, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # ci, not install: the lockfile is the contract. It also fails loudly if
      # package.json and the lockfile have drifted apart.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # Nothing should ever add a real .env to the repo. Cheap insurance against
      # the one mistake that is expensive to undo.
      - name: no committed secrets
        working-directory: .
        run: |
          # Catches .env and .env.* at any depth, including the repo root
          # (a bare '**/.env' pathspec misses root-level files). .env.example
          # is the documented template and is allowed.
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env\.example$'; then
            echo "::error::a .env file is tracked by git"; exit 1
          fi
          echo "no tracked .env files"
